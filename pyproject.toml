[project]
name = "packlist"
version = "0.1.0"
description = "Packing lists that learn: master lists in packing order, trips built from them, a phone checklist to tick things off."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
]

[project.scripts]
pack = "packlist.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["packlist"]
